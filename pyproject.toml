[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-doc-system"
version = "1.0.0"
description = "Production-grade AI Document Processing & RAG System"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "RAG System", email = "admin@ragdocsystem.com" }]

dependencies = [
    # ── Web Framework ──────────────────────────────────────────────────────────
    "fastapi==0.110.3",
    "uvicorn[standard]==0.29.0",
    "python-multipart==0.0.9",

    # ── Data Validation ────────────────────────────────────────────────────────
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",

    # ── Database ───────────────────────────────────────────────────────────────
    "sqlalchemy==2.0.30",
    "asyncpg==0.29.0",
    "alembic==1.13.1",

    # ── Task Queue ─────────────────────────────────────────────────────────────
    "celery[redis]==5.4.0",
    "flower==2.0.1",

    # ── Cache ──────────────────────────────────────────────────────────────────
    "redis==5.0.4",

    # ── Vector Store ───────────────────────────────────────────────────────────
    "qdrant-client==1.9.1",

    # ── AI / Groq ──────────────────────────────────────────────────────────────
    "groq==0.9.0",

    # ── Document Parsing ───────────────────────────────────────────────────────
    "pdfplumber==0.11.0",
    "python-docx==1.1.2",

    # ── Auth / Security ────────────────────────────────────────────────────────
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",

    # ── Logging ────────────────────────────────────────────────────────────────
    "structlog==24.1.0",

    # ── Rate Limiting ──────────────────────────────────────────────────────────
    "slowapi==0.1.9",

    # ── HTTP ───────────────────────────────────────────────────────────────────
    "httpx==0.27.0",

    # ── Retrieval Helpers ──────────────────────────────────────────────────────
    "rank-bm25==0.2.2",
    "tiktoken==0.7.0",

    # ── Resilience ─────────────────────────────────────────────────────────────
    "tenacity==8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "factory-boy==3.3.0",
    "faker==25.2.0",
    "black==24.4.2",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
